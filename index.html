<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#F6F4EF">

<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#F6F4EF;--ink:#3B3A36;--soft:#8A867D;--faint:#C4BFB3;--line:#E6E2D8;--acc:#6F7F73;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#1C1C1A;--ink:#D8D5CE;--soft:#8F8B82;--faint:#55534D;--line:#2C2B28;--acc:#8FA394}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;-webkit-touch-callout:none}
#app{height:100%;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{padding:14px 20px 6px}
h1{margin:4px 0 10px;font-size:30px;font-weight:700;user-select:none;-webkit-user-select:none}
.search,textarea,select{font:inherit;color:var(--ink);outline:0}
.search{width:100%;border:0;border-radius:10px;background:var(--line);padding:9px 12px}
.list,.lines{flex:1;overflow:auto;padding:4px 20px}
.item{padding:11px 0;border-bottom:1px solid var(--line)}
.item b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item span,.soft{color:var(--soft);font-size:13px}
.empty{color:var(--soft);text-align:center;margin-top:48px}
.bar{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;min-height:44px}
button{background:none;border:0;color:var(--acc);font:inherit;padding:6px 4px}
.ed{flex:1;border:0;background:none;padding:8px 20px;resize:none}
.ln{display:flex;gap:10px;align-items:baseline;padding:5px 0}
.ln p{margin:0;flex:1;white-space:pre-wrap;word-break:break-word}
.ln.t{padding-left:12px;border-left:2px solid var(--faint)}
.ln time{font-size:11px;color:var(--faint)}
.ph{color:var(--acc)}.ln img{max-width:100%;max-height:260px;border-radius:8px;display:block;margin-top:4px}.hint{display:flex;gap:10px;align-items:center;padding:6px 20px;font-size:13px;color:var(--soft)}.hint span{flex:1;cursor:pointer}.hint button{font-size:13px;color:var(--soft)}
.pics{display:flex;gap:8px;overflow-x:auto;padding:0 20px 8px}.pics img{width:72px;height:72px;object-fit:cover;border-radius:8px;flex:none}.vw{flex-direction:column;gap:14px;background:rgba(0,0,0,.88)}.vw button{color:#fff}.vb{display:flex;gap:22px}.ln .dl{display:none;color:var(--soft);font-size:13px}.ln.sel .dl{display:inline}.vw img{max-width:100%;max-height:calc(100% - 64px)}
.day{text-align:center;font-size:12px;color:var(--faint);margin:14px 0 6px}
.comp{display:flex;gap:6px;align-items:flex-end;padding:8px 16px;border-top:1px solid var(--line)}
.comp textarea{flex:1;border:0;background:var(--line);border-radius:10px;padding:8px 12px;resize:none;max-height:120px}
.comp select{border:0;background:none;color:var(--soft);font-size:13px;padding:6px 0}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:var(--bg);border-radius:14px;padding:18px;width:100%;max-width:340px}
.card input{width:100%;border:0;border-radius:8px;background:var(--line);color:var(--ink);font:inherit;padding:9px 12px;margin:6px 0 10px}
.row{display:flex;justify-content:space-between}
</style>
</head>
<body>
<div id="app"></div>
<script>
const SB_URL="https://rcecnzsakcjgkeifbslw.supabase.co",SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJjZWNuenNha2NqZ2tlaWZic2x3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyNzM3OTUsImV4cCI6MjEwNjg0OTc5NX0.DNgJRpCwnslC_7titQOaXzYibDaU_mg1jMMy_9JlkPU";

const $=s=>document.querySelector(s),enc=new TextEncoder(),dec=new TextDecoder(),LS=localStorage;
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
const b64=b=>{const u=new Uint8Array(b);let s="";for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s)},ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const sha=async s=>hex(await crypto.subtle.digest("SHA-256",enc.encode(s)));

// 合言葉 → 部屋ID と 暗号鍵(別々に導出)。サーバーには合言葉も平文も渡らない
async function pbk(p,salt){const k=await crypto.subtle.importKey("raw",enc.encode(p.normalize("NFKC").trim()),"PBKDF2",false,["deriveBits"]);return crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:enc.encode(salt),iterations:150000},k,256)}
async function derive(p){const room=hex(await pbk(p,"memo.room.v1"));const key=await crypto.subtle.importKey("raw",await pbk(p,"memo.key.v1"),"AES-GCM",false,["encrypt","decrypt"]);return{room,key}}
async function seal(key,o){const iv=crypto.getRandomValues(new Uint8Array(12));return b64(iv)+"."+b64(await crypto.subtle.encrypt({name:"AES-GCM",iv},key,enc.encode(JSON.stringify(o))))}
async function unseal(key,s){try{const[i,c]=s.split(".");return JSON.parse(dec.decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:ub64(i)},key,ub64(c))))}catch{return null}}
async function rpc(fn,a){const h={apikey:SB_KEY,"Content-Type":"application/json"};if(SB_KEY.startsWith("eyJ"))h.Authorization="Bearer "+SB_KEY;const r=await fetch(`${SB_URL}/rest/v1/rpc/${fn}`,{method:"POST",headers:h,body:JSON.stringify(a)});if(!r.ok)throw new Error(r.status);const t=await r.text();return t?JSON.parse(t):null}

const u8=s=>{s=s.replace(/-/g,"+").replace(/_/g,"/");return ub64(s+"=".repeat((4-s.length%4)%4))};
async function fnc(op,a){const h={apikey:SB_KEY,"Content-Type":"application/json"};if(SB_KEY.startsWith("eyJ"))h.Authorization="Bearer "+SB_KEY;const r=await fetch(`${SB_URL}/functions/v1/memo_push`,{method:"POST",headers:h,body:JSON.stringify({op,...a})});if(!r.ok)throw new Error(r.status);return r.json()}
const ping=x=>x&&fnc("notify",{room:x.room,dev:x.me}).catch(()=>{});
let ps="";
async function enablePush(room,perm){
  ps="非対応";if(!("serviceWorker"in navigator&&"PushManager"in window))throw new Error("ホーム画面から開き直してください");
  ps="許可";if(await perm!=="granted")throw new Error("通知が許可されていません");
  ps="SW";const reg=await Promise.race([navigator.serviceWorker.ready,new Promise((_,j)=>setTimeout(()=>j(new Error("準備できません")),8000))]);
  ps="鍵";const{pk}=await fnc("key",{});
  ps="登録";const sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:u8(pk)});
  ps="保存";await rpc("memo_sub",{p_room:room,p_dev:LS["memo.i"]||(LS["memo.i"]=crypto.randomUUID()),p_sub:sub.toJSON()});
}
const app=$("#app");let S=null,T=0;
let notes=JSON.parse(LS["memo.n"]||"null")||[{id:1,u:Date.now()-1728e5,b:"買い物\n牛乳\n卵\n食パン\n洗剤"},{id:2,u:Date.now()-432e6,b:"今週の予定\n水　燃えるごみ\n金　資源ごみ"}];
const db=new Promise((ok,ng)=>{const r=indexedDB.open("memo",1);r.onupgradeneeded=()=>r.result.createObjectStore("p");r.onsuccess=()=>ok(r.result);r.onerror=ng});
const idb=async(m,f)=>{const d=await db;return new Promise((ok,ng)=>{const t=d.transaction("p",m),r=f(t.objectStore("p"));t.oncomplete=()=>ok(r.result);t.onerror=ng})};
const pPut=(k,v)=>idb("readwrite",s=>s.put(v,k)),pGet=k=>idb("readonly",s=>s.get(k)),pDel=k=>idb("readwrite",s=>s.delete(k));
function shrink(f,mx=1600,q=.8){return new Promise((ok,ng)=>{const u=URL.createObjectURL(f),i=new Image();i.onload=()=>{const k=Math.min(1,mx/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext("2d").drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?ok(b):ng(),"image/jpeg",q)};i.onerror=ng;i.src=u})}
const persist=()=>LS["memo.n"]=JSON.stringify(notes);
const title=n=>n.b.split("\n")[0]||"新規メモ";
let hold=0;const CARDS=[
["今日いちばん心に残ったことは？","最近、ちょっと嬉しかったことを一つ","ありがとうを、まだ言えていないことは？","今の気持ちを天気にたとえると？","最近よく思い出す場面は？","今、何を食べたい気分？"],
["遠慮して言わなかったことを、一つだけ正直に","最近、ちょっと寂しかった瞬間は？","好きなところで、まだ言っていないものは？","直してほしいことと、変わらないでほしいこと、一つずつ","次に会えたら、いちばんしたいことは？","最近、少しだけ嫉妬したことは？"],
["何も気にしなくていいなら、今いちばん伝えたいことは？","ずっと聞きたかったのに聞けていない質問を、今ここで","「大丈夫」と言ったけれど、本当は大丈夫じゃなかったこと","これを読んだら、考えずに30秒で返事を書いてみて","一年後、どんな関係でいたいか、正直に","次に会ったとき、いきなりやってみたい小さな大胆なことを一つ"]];
let lv=1;const pick=()=>{const a=CARDS[lv];return a[Math.floor(Math.random()*a.length)]};
const lock=()=>{clearInterval(T);T=0;S=null};

// ── 表の顔: ふつうのメモ帳 ──
function home(){
  lock();
  app.innerHTML=`<header><h1 id="h">メモ</h1><input class="search" id="q" type="search" placeholder="検索" enterkeyhint="search" autocomplete="off" autocapitalize="off" spellcheck="false"></header><div class="list" id="ls"></div><div class="bar"><span class="soft" id="cnt"></span><button id="add">＋ 新規</button></div>`;
  fill("");
  const q=$("#q");q.oninput=()=>fill(q.value);q.onkeydown=e=>{if(e.key==="Enter")unlock(q.value)};
  $("#add").onclick=()=>{const n={id:Date.now(),u:Date.now(),b:""};notes.push(n);edit(n.id)};
  $("#ls").onclick=e=>{const i=e.target.closest(".item");if(i)edit(+i.dataset.i)};
  let p;const h=$("#h");h.onpointerdown=()=>p=setTimeout(setup,800);h.onpointerup=h.onpointerleave=()=>clearTimeout(p);
}
function fill(q){
  const L=notes.filter(n=>n.b.includes(q)).sort((a,b)=>b.u-a.u);
  $("#ls").innerHTML=L.map(n=>`<div class="item" data-i="${n.id}"><b>${esc(title(n))}</b><span>${new Date(n.u).toLocaleDateString("ja-JP")}　${esc(n.b.split("\n")[1]||(n.ph&&n.ph.length?"写真 "+n.ph.length+"枚":"追加のテキストなし"))}</span></div>`).join("")||'<p class="empty">見つかりません</p>';
  $("#cnt").textContent=notes.length+"件のメモ";
}
function edit(id){
  const n=notes.find(x=>x.id===id);
  app.innerHTML=`<div class="bar"><button id="bk">‹ メモ</button><span><button id="cm">撮影</button><button id="ph">写真</button><button id="dl">削除</button></span></div><textarea class="ed" id="ed" placeholder="メモ"></textarea><div class="pics" id="pics"></div><input id="pic" type="file" accept="image/*" hidden><input id="cam" type="file" accept="image/*" capture="environment" hidden>`;
  const t=$("#ed");t.value=n.b;t.oninput=()=>{n.b=t.value;n.u=Date.now();persist()};
  $("#bk").onclick=()=>{if(!n.b.trim()&&!(n.ph&&n.ph.length))notes=notes.filter(x=>x!==n);persist();home()};
  $("#dl").onclick=async()=>{for(const k of n.ph||[])await pDel(k).catch(()=>{});notes=notes.filter(x=>x!==n);persist();home()};
  $("#ph").onclick=()=>$("#pic").click();$("#cm").onclick=()=>$("#cam").click();
  $("#pic").onchange=$("#cam").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;try{const b=await shrink(f),k="p"+Date.now();await pPut(k,b);(n.ph=n.ph||[]).push(k);n.u=Date.now();persist();pics(n)}catch{}};
  pics(n);
}
async function pics(n){
  const w=$("#pics");if(!w)return;w.innerHTML="";
  for(const k of n.ph||[]){const b=await pGet(k).catch(()=>null);if(!b)continue;const u=URL.createObjectURL(b),i=new Image();i.src=u;i.onclick=()=>viewPic(n,k,b,u);w.appendChild(i)}
}
function viewPic(n,k,b,u){
  const d=document.createElement("div");d.className="sheet vw";
  d.innerHTML=`<img src="${u}"><div class="vb"><button id="sh">共有・保存</button><button id="rm">削除</button><button id="cl">閉じる</button></div>`;
  document.body.appendChild(d);
  $("#cl").onclick=()=>d.remove();
  $("#rm").onclick=async()=>{await pDel(k).catch(()=>{});n.ph=n.ph.filter(x=>x!==k);persist();d.remove();pics(n)};
  $("#sh").onclick=async()=>{const f=new File([b],"photo.jpg",{type:"image/jpeg"});try{if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f]});else{const a=document.createElement("a");a.href=u;a.download="photo.jpg";a.click()}}catch{}};
}

// ── 合言葉の設定: 「メモ」の文字を長押し ──
function setup(){
  const d=document.createElement("div");d.className="sheet";
  d.innerHTML=`<div class="card"><div>合言葉（相手と同じもの・6文字以上）</div><input id="ph" type="password" autocomplete="off"><label class="soft" style="display:block;margin:0 0 10px"><input id="nt" type="checkbox" style="width:auto;display:inline;margin:0 6px 0 0">この端末で通知を受け取る</label><div class="row"><button id="ok">保存</button><button id="rs">解除</button><button id="cx">閉じる</button></div><div class="soft" id="msg">${LS["memo.c"]?"設定済み":"未設定"}</div></div>`;
  document.body.appendChild(d);
  $("#cx").onclick=()=>d.remove();$("#rs").onclick=async()=>{delete LS["memo.c"];try{const r=await navigator.serviceWorker.ready,s=await r.pushManager.getSubscription();if(s)await s.unsubscribe()}catch{}d.remove()};
  $("#ok").onclick=async()=>{
    const v=$("#ph").value;if(v.trim().length<6){$("#msg").textContent="短すぎます";return}
    const perm=$("#nt").checked&&"Notification"in window?Notification.requestPermission():null;   // タップ直後に許可を求める(iPhone対策)
    const dv=await derive(v);LS["memo.c"]=await sha(dv.room);
    if($("#nt").checked){try{await enablePush(dv.room,perm)}catch(e){$("#msg").textContent="保存しました。通知は有効にできませんでした（"+ps+"："+((e&&e.message)||e)+"）";return}}
    d.remove();
  };
}

// ── 裏の顔: 検索欄に合言葉を入れて Enter ──
async function unlock(t){
  const c=LS["memo.c"];if(!c||t.trim().length<6)return;
  const d=await derive(t);if(await sha(d.room)!==c)return;
  S={...d,last:0,seen:new Set(),day:"",me:LS["memo.i"]||(LS["memo.i"]=crypto.randomUUID())};chat();
}
function chat(){
  if(navigator.clearAppBadge)navigator.clearAppBadge().catch(()=>{});
  if(window.caches)caches.delete("memo-n");
  if(navigator.serviceWorker)navigator.serviceWorker.ready.then(r=>r.getNotifications()).then(l=>l.forEach(n=>n.close())).catch(()=>{});
  app.innerHTML=`<div class="bar"><button id="bk">‹ メモ</button><span><span class="soft" id="st"></span> <button id="cm">撮影</button><button id="pc">写真</button></span></div><div class="lines" id="ls"></div><div class="hint"><span id="hx"></span><button id="hl">大胆</button><button id="hn">別の</button></div><div class="comp"><textarea id="in" rows="1" placeholder="書き足す"></textarea><select id="ttl"><option value="3600">1時間</option><option value="86400" selected>1日</option><option value="604800">7日</option><option value="315360000">残す</option><option value="b">読んだら消す</option></select><button id="sd">追加</button></div><input id="pic" type="file" accept="image/*" hidden><input id="cam" type="file" accept="image/*" capture="environment" hidden>`;
  $("#bk").onclick=home;$("#sd").onclick=send;
  const hx=$("#hx"),nx=()=>hx.textContent=pick();nx();$("#hn").onclick=nx;
  $("#hl").onclick=()=>{lv=(lv+1)%3;$("#hl").textContent=["やさしめ","大胆","もっと大胆"][lv];nx()};
  hx.onclick=()=>{const i=$("#in");i.value=hx.textContent+"\n";i.focus()};$("#cm").onclick=()=>{hold=Date.now()+12e4;$("#cam").click()};$("#pc").onclick=()=>{hold=Date.now()+12e4;$("#pic").click()};for(const k of["#pic","#cam"])$(k).onchange=e=>{hold=0;sendPic(e.target.files[0]);e.target.value=""};$("#ls").onclick=tap;
  const i=$("#in");i.oninput=()=>{i.style.height="auto";i.style.height=Math.min(i.scrollHeight,120)+"px"};
  pull();T=setInterval(pull,4000);
}
function add(m,ts,id,bo){
  const ls=$("#ls"),dt=new Date(ts),day=dt.toLocaleDateString("ja-JP",{month:"long",day:"numeric"}),me=m.f===S.me;
  if(day!==S.day){S.day=day;ls.insertAdjacentHTML("beforeend",`<div class="day">${day}</div>`)}
  ls.insertAdjacentHTML("beforeend",`<div class="ln${me?" me":" t"}" data-id="${id}" data-p="${m.p?1:""}" data-b="${bo?1:""}"><p class="${m.p?"ph":""}">${m.p?"写真（タップで表示）":esc(m.t)}</p><time>${dt.toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"})}</time>${me?'<button class="dl">削除</button>':""}</div>`);
  ls.scrollTop=ls.scrollHeight;
}
async function tap(e){
  const l=e.target.closest(".ln");if(!l||!S)return;const s=S,id=+l.dataset.id;
  if(e.target.matches(".dl")){try{await rpc("memo_del",{p_room:s.room,p_ids:[id]});l.remove()}catch{$("#st").textContent="削除できませんでした"}return}
  if(e.target.matches("img")){const d=document.createElement("div");d.className="sheet vw";d.innerHTML=`<img src="${e.target.src}">`;d.onclick=()=>d.remove();document.body.appendChild(d);return}
  if(l.dataset.p&&!l.dataset.ok){
    try{const x=await rpc("memo_img",{p_room:s.room,p_id:id}),o=x&&await unseal(s.key,x);
      if(S!==s)return;
      if(!o||!/^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/.test(o.d)){l.querySelector("p").textContent="表示できません";return}
      l.dataset.ok=1;l.querySelector("p").className="";l.querySelector("p").innerHTML=`<img src="${o.d}">`;
      if(l.dataset.b)rpc("memo_burn",{p_room:s.room,p_ids:[id]}).catch(()=>{});
    }catch{$("#st").textContent="接続できません"}
  }else if(l.classList.contains("me"))l.classList.toggle("sel");
}
const toURL=b=>new Promise(ok=>{const r=new FileReader();r.onload=()=>ok(r.result);r.readAsDataURL(b)});
async function sendPic(f){
  if(!f||!S)return;const s=S,b=$("#ttl").value==="b",ttl=b?604800:+$("#ttl").value;
  try{const d=await toURL(await shrink(f,1200,.65));await rpc("memo_send",{p_room:s.room,p_payload:await seal(s.key,{f:s.me,t:"",p:1}),p_ttl_sec:ttl,p_burn:b,p_img:await seal(s.key,{d})});pull();ping(s)}
  catch{if(S===s)$("#st").textContent="送れませんでした"}
}
async function pull(){
  const s=S;if(!s||s.busy)return;s.busy=1;
  try{
    const rows=await rpc("memo_fetch",{p_room:s.room,p_after:s.last}),burn=[];
    for(const r of rows){
      s.last=Math.max(s.last,r.mid);if(s.seen.has(r.mid))continue;s.seen.add(r.mid);
      const m=await unseal(s.key,r.mpayload);if(!m||S!==s)continue;
      add(m,r.mcreated,r.mid,r.mburn&&m.f!==s.me);if(r.mburn&&m.f!==s.me&&!m.p)burn.push(r.mid);
    }
    if(burn.length)rpc("memo_burn",{p_room:s.room,p_ids:burn}).catch(()=>{});
    if(S===s)$("#st").textContent="";
  }catch{if(S===s)$("#st").textContent="接続できません"}
  s.busy=0;
}
async function send(){
  const el=$("#in"),v=el.value.trim();if(!v||!S)return;
  const b=$("#ttl").value==="b",ttl=b?604800:+$("#ttl").value;el.value="";el.style.height="auto";
  try{await rpc("memo_send",{p_room:S.room,p_payload:await seal(S.key,{f:S.me,t:v}),p_ttl_sec:ttl,p_burn:b});pull();ping(S)}
  catch{el.value=v;$("#st").textContent="送れませんでした"}
}
